# A push to the branch "vorschau" rebuilds the preview at https://mein.henoch.app/vorschau/.
# Publishing stays with main: this starts the Pages workflow on main, which builds the app from
# main unchanged and the preview from this branch.
name: Vorschau

on:
  push:
    branches: [vorschau]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
