# Builds the app and publishes it on GitHub Pages at https://mein.henoch.app/.
# One-time setup: Settings → Pages → Source: "GitHub Actions", Custom domain: mein.henoch.app.
# Beside it, the branch "vorschau" becomes the preview at https://mein.henoch.app/vorschau/ (PREVIEW=1:
# own name and database). A push to "vorschau" starts this workflow on main (vorschau.yml): the app
# is built from main as it is, only the preview is new.
name: Pages

on:
  push:
    # Published from main only (22.10.2026): two branches publishing overwrote each other.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Luther 1912 text (public domain, CC0) for checking every Bible verse word for word.
      - name: Fetch Luther 1912
        run: |
          mkdir -p ../lut1912
          cd ../lut1912
          npm pack xmlbible-lut1912
          tar xzf xmlbible-lut1912-*.tgz
          # The tarball's folders carry no permissions; make them readable.
          chmod -R u+rwX package
          test "$(ls package/text | wc -l)" -gt 60
      - run: npm test
        env:
          LUT1912_DIR: ../lut1912/package/text
      - run: npm run build
        env:
          BASE_PATH: /
      # Pages has no rewrites: unknown paths (e.g. /abend) get 404.html, which is the app.
      # Under /vorschau/ it leads to the preview's start instead.
      - run: |
          cp dist/index.html dist/404.html
          sed -i 's#<head>#<head><script>var p=location.pathname;if(p.indexOf("/vorschau/")===0\&\&p!=="/vorschau/")location.replace("/vorschau/")</script>#' dist/404.html
      # The preview: the branch "vorschau", if there is one. If it fails, the app is published without it.
      - name: Preview
        continue-on-error: true
        run: |
          git ls-remote --exit-code --heads origin vorschau || { echo "No branch vorschau"; exit 0; }
          git fetch --depth=1 origin vorschau
          git worktree add ../vorschau FETCH_HEAD
          cd ../vorschau
          npm ci
          LUT1912_DIR=$GITHUB_WORKSPACE/../lut1912/package/text npm test
          BASE_PATH=/vorschau/ PREVIEW=1 npm run build
          cp -r dist "$GITHUB_WORKSPACE/dist/vorschau"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
