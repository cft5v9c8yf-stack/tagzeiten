# Builds the app and publishes it on GitHub Pages at /tagzeiten/.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [claude/focused-pascal-sol6ng, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Luther 1912 text (public domain, CC0) for checking every Bible verse word for word.
      - name: Fetch Luther 1912
        run: |
          mkdir -p ../lut1912
          cd ../lut1912
          npm pack xmlbible-lut1912
          tar xzf xmlbible-lut1912-*.tgz
          ls package/text | wc -l
      - run: npm test
        env:
          LUT1912_DIR: ../lut1912/package/text
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Pages has no rewrites: unknown paths (e.g. /tagzeiten/abend) get 404.html, which is the app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
